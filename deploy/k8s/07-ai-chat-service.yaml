apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chat-service
  namespace: trendies
  labels:
    app: ai-chat-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-chat-service
  template:
    metadata:
      labels:
        app: ai-chat-service
    spec:
      containers:
        - name: ai-chat-service
          image: trendies-ai-chat-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
              name: http
          env:
            - name: PORT
              value: "5001"
            - name: NODE_ENV
              value: "development"
            - name: BACKEND_SERVICE_URL
              value: "http://backend:3000"
            - name: AI_MODEL
              value: "deepseek/deepseek-chat-v3-0324"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trendies-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-chat-service
  namespace: trendies
  labels:
    app: ai-chat-service
spec:
  type: ClusterIP
  selector:
    app: ai-chat-service
  ports:
    - port: 5001
      targetPort: 5001
      name: http
