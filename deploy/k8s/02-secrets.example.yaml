# ==========================================
# Kubernetes Secrets Example
# ==========================================
# Copy this file to 02-secrets.yaml and fill in your values,
# OR generate directly from backend/.env using:
# kubectl create secret generic trendies-secrets --from-env-file=backend/.env -n trendies
#
# Do NOT commit real credentials to Git.

apiVersion: v1
kind: Secret
metadata:
  name: trendies-secrets
  namespace: trendies
type: Opaque
stringData:
  JWT_SECRET: "placeholder_jwt_secret_key"
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "placeholder_admin_password"
  CLOUDINARY_NAME: "placeholder_cloudinary_name"
  CLOUDINARY_API_KEY: "placeholder_cloudinary_key"
  CLOUDINARY_API_SECRET: "placeholder_cloudinary_secret"
  RAZORPAY_KEY_ID: "placeholder_razorpay_key_id"
  RAZORPAY_KEY_SECRET: "placeholder_razorpay_key_secret"
  RAZORPAY_WEBHOOK_SECRET: "placeholder_webhook_secret"
  OPENROUTER_API_KEY: "placeholder_openrouter_api_key"
  FIREBASE_PROJECT_ID: "placeholder_firebase_project_id"
  FIREBASE_CLIENT_EMAIL: "placeholder_client_email"
  FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nPLACEHOLDER\n-----END PRIVATE KEY-----\n"
